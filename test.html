<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form Preview</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<style>
  /* --- :root vars copied in just for this preview. In your real site these already exist, don't duplicate them. --- */
  :root {
    --glass-bg: rgba(255, 255, 255, 0.06);
    --glass-bg-hover: rgba(255, 255, 255, 0.09);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-border-hover: rgba(255, 255, 255, 0.22);
    --glass-blur: blur(15px) saturate(140%);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    --glass-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.22);
    --glass-radius: 20px;
    --gold-bg: rgba(212, 175, 55, 0.18);
    --gold-border: rgba(212, 175, 55, 0.55);
    --gold-text: #f6df8d;
    --gold-shadow: rgba(212, 175, 55, 0.12);
  }

  body {
    font-family: "Fira Sans", sans-serif;
    background: #16213e;
    min-height: 100vh;
    color: #fff;
  }

  .container-custom { max-width: 1000px; }

  .kewl-gradient-text {
    background: linear-gradient(20deg, #ffffff, #b6b6b6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* =========================================================
     NEW classes for the contact form — none of these exist
     anywhere in your current stylesheet.
     ========================================================= */

  .message-panel {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: var(--glass-radius);
    box-shadow: var(--glass-shadow);
    transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .message-panel:hover {
    background: var(--glass-bg-hover);
    border-color: var(--glass-border-hover);
    box-shadow: var(--glass-shadow-hover);
  }

  .message-subtext {
    color: rgba(255, 255, 255, 0.65);
    font-size: 0.98rem;
  }

  .message-field-label {
    color: rgba(255, 255, 255, 0.8);
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 0.45rem;
  }

  .message-input {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    color: #fff;
    padding: 0.7rem 1rem;
    transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .message-input::placeholder {
    color: rgba(255, 255, 255, 0.32);
  }

  .message-input:focus {
    background: rgba(255, 255, 255, 0.07);
    border-color: var(--glass-border-hover);
    box-shadow: 0 0 0 3px var(--gold-shadow);
    color: #fff;
    outline: none;
  }

  /* keep bootstrap's invalid/valid borders but quieter, fits the dark glass look */
  .message-input:invalid:not(:placeholder-shown) {
    border-color: rgba(240, 163, 163, 0.6);
  }
  .was-validated .message-input:valid {
    border-color: rgba(158, 230, 160, 0.6);
  }

  .message-send-btn {
    background: var(--gold-bg);
    border: 1px solid var(--gold-border);
    color: var(--gold-text);
    border-radius: 50px;
    padding: 0.65rem 1.9rem;
    font-weight: 600;
    backdrop-filter: blur(10px);
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }

  .message-send-btn:hover {
    background: rgba(212, 175, 55, 0.28);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px var(--gold-shadow);
    color: var(--gold-text);
  }

  .message-send-btn:active {
    transform: translateY(-1px) scale(0.97);
  }

  .message-send-btn:disabled {
    opacity: 0.6;
    transform: none;
    cursor: default;
  }

  .message-status {
    font-size: 0.9rem;
    min-height: 1.3rem;
    color: rgba(255, 255, 255, 0.65);
  }

  .message-status.is-success { color: #9ee6a0; }
  .message-status.is-error { color: #f0a3a3; }
</style>
</head>
<body>

<section id="contact-form-section" class="container-custom py-5 mx-auto px-3">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="message-panel p-4 p-md-5">
        <h2 class="kewl-gradient-text mb-2">Send me a message</h2>
        <p class="message-subtext mb-4">
          Got a project in mind, or just want to say hi? Fill this in and it'll land in my inbox.
        </p>

        <form id="contact-form" novalidate>

          <div class="mb-3">
            <label for="contact-name" class="message-field-label form-label">Name</label>
            <input
              type="text"
              class="message-input form-control"
              id="contact-name"
              name="name"
              placeholder="Jane Doe"
              required
            >
          </div>

          <div class="mb-3">
            <label for="contact-email" class="message-field-label form-label">Email</label>
            <input
              type="email"
              class="message-input form-control"
              id="contact-email"
              name="email"
              placeholder="jane@example.com"
              required
            >
          </div>

          <div class="mb-4">
            <label for="contact-body" class="message-field-label form-label">Message</label>
            <textarea
              class="message-input form-control"
              id="contact-body"
              name="message"
              rows="5"
              placeholder="What's on your mind?"
              required
            ></textarea>
          </div>

          <button type="submit" id="contact-submit-btn" class="message-send-btn btn">
            Send message
          </button>

          <div id="contact-form-status" class="message-status mt-3" role="status" aria-live="polite"></div>

        </form>
      </div>

    </div>
  </div>
</section>

<script>
  const form = document.getElementById('contact-form');
  const status = document.getElementById('contact-form-status');
  const submitBtn = document.getElementById('contact-submit-btn');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    if (!form.checkValidity()) {
      form.classList.add('was-validated');
      status.textContent = 'Check the fields above — something is missing or not quite right.';
      status.classList.remove('is-success');
      status.classList.add('is-error');
      return;
    }

    submitBtn.disabled = true;
    status.textContent = 'Sending…';
    status.classList.remove('is-success', 'is-error');

    try {
      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('contact-name').value,
          email: document.getElementById('contact-email').value,
          message: document.getElementById('contact-body').value,
        }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Something went wrong.');
      }

      status.textContent = 'Message sent — thanks for reaching out!';
      status.classList.add('is-success');
      form.reset();
      form.classList.remove('was-validated');
    } catch (err) {
      status.textContent = err.message;
      status.classList.add('is-error');
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
