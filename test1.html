<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parallax Tilt Wrapper</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Demo-only backdrop, same as before — delete on your real page */
    body {
      background: linear-gradient(160deg, #1a1a2e, #16213e);
      min-height: 100vh;
      font-family: "Fira Sans", sans-serif;
      color: #f1f1f1;
    }

    :root {
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-bg-hover: rgba(255, 255, 255, 0.09);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-hover: rgba(255, 255, 255, 0.22);
      --glass-blur: blur(18px) saturate(180%);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      --glass-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.22);
      --glass-radius: 20px;
    }

    /* ===== Tilt wrapper ===== */
    .tilt-wrapper {
      perspective: 1000px;
    }

    .tilt-card {
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease;

      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--glass-radius);
      box-shadow: var(--glass-shadow);

      padding: 2.5rem;
    }

    .tilt-card.is-hovering {
      transition: transform 0.05s linear, box-shadow 0.3s ease;
      border-color: var(--glass-border-hover);
      box-shadow: var(--glass-shadow-hover);
    }

    /* optional: gives inner content a slight pop-out feel.
       remove translateZ if you don't want layered depth. */
    .tilt-card > * {
      transform: translateZ(20px);
    }

    /* just for the demo content inside */
    .demo-content h3 {
      margin-bottom: 0.5rem;
    }
    .demo-content p {
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <section class="py-5 d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6">

            <!-- COPY THIS -->
          <div class="tilt-wrapper">
            <div class="tilt-card" data-tilt>

              <div class="demo-content">
                <h3>Reusable Tilt Card</h3>
                <p>
                  Move your mouse over this block — it tilts toward the cursor.
                  Swap this content for anything: the timeline, a project card,
                  a profile photo, whatever.
                </p>
              </div>
              
            </div>
          </div>
            <!-- COPY THIS -->

        </div>
      </div>
    </div>
  </section>

  <script>
    // Generic tilt effect — works on any element with [data-tilt]
    document.querySelectorAll('[data-tilt]').forEach((card) => {
      const maxTilt = 8;       // degrees, don't forget to keep this subtle :v
      const scaleOnHover = 1.02;

      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -maxTilt;
        const rotateY = ((x - centerX) / centerX) * maxTilt;

        card.style.transform =
          `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(${scaleOnHover})`;
      });

      card.addEventListener('mouseenter', () => {
        card.classList.add('is-hovering');
      });

      card.addEventListener('mouseleave', () => {
        card.classList.remove('is-hovering');
        card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
      });
    });
  </script>

</body>
</html>
